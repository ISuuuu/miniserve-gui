name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.1.0)"
        required: true
        default: "v0.1.0"
        type: string
      body:
        description: "Release notes / 更新说明 (留空则自动根据 Commit 生成)"
        required: false
        type: string

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate Release Notes from Git
        id: changelog
        shell: bash
        run: |
          TAG="${{ github.event.inputs.version || github.ref_name }}"
          git fetch --tags --quiet
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog between $PREV_TAG and HEAD"
            LOGS=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges --pretty=format:"- %s")
          else
            echo "No previous tag found, generating recent log"
            LOGS=$(git log -20 --oneline --no-merges --pretty=format:"- %s")
          fi

          INPUT_BODY="${{ github.event.inputs.body }}"
          if [ -n "$INPUT_BODY" ]; then
            FINAL_BODY="$INPUT_BODY"
          else
            FINAL_BODY="$LOGS"
          fi

          {
            echo "RELEASE_NOTES<<EOF"
            echo "$FINAL_BODY"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Sync version to manifests
        shell: bash
        run: |
          # 提取版本号（去掉前面的 v）
          RAW_V="${{ github.event.inputs.version || github.ref_name }}"
          V=${RAW_V#v}
          echo "Syncing version: $V"

          # 1. 更新 package.json (仅匹配第一个 version 字段)
          if [ -f package.json ]; then
            sed -i "0,/\"version\": \".*\"/s//\"version\": \"$V\"/" package.json
          fi

          # 2. 更新 tauri.conf.json
          if [ -f src-tauri/tauri.conf.json ]; then
            sed -i "s/\"version\": \".*\"/\"version\": \"$V\"/g" src-tauri/tauri.conf.json
          fi

          # 3. 更新 Cargo.toml (仅匹配 [package] 下的第一个 version)
          if [ -f src-tauri/Cargo.toml ]; then
            sed -i "0,/^version = .*/s//version = \"$V\"/" src-tauri/Cargo.toml
          fi

      - name: Install dependencies (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Check Signing Secret
        shell: bash
        env:
          SIGN_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGN_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty or missing!"
            exit 1
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is present (length: ${#SIGN_KEY})."
          fi

      - name: Build Tauri app
        id: build
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 强制云端打包使用极致体积优化覆盖 Cargo.toml 中的默认 release 配置
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"

        with:
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: "miniserve-gui ${{ github.event.inputs.version || github.ref_name }}"
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false

      - name: Pack and Upload Windows Portable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          # 便携版以 zip 分发：内含可执行文件 + portable.flag 标记 + 预留 data 目录
          $ROOT_NAME = "miniserve-gui-portable"
          $PACKAGE_DIR = Join-Path $env:RUNNER_TEMP "portable-package"
          $PORTABLE_DIR = Join-Path $PACKAGE_DIR $ROOT_NAME
          $ZIP_PATH = Join-Path $PACKAGE_DIR "miniserve-gui_${env:TAG}_portable_x64.zip"

          New-Item -ItemType Directory -Path (Join-Path $PORTABLE_DIR "data") -Force | Out-Null
          Copy-Item "src-tauri/target/release/miniserve-gui.exe" $PORTABLE_DIR
          New-Item -ItemType File -Path (Join-Path $PORTABLE_DIR "portable.flag") -Force | Out-Null
          New-Item -ItemType File -Path (Join-Path $PORTABLE_DIR "data/.keep") -Force | Out-Null

          # 在包目录内打包，保留顶层目录，解压后直接得到 miniserve-gui-portable/
          Push-Location $PACKAGE_DIR
          7z a -tzip -mx=7 $ZIP_PATH $ROOT_NAME
          Pop-Location

          pnpm tauri signer sign $ZIP_PATH --private-key $env:TAURI_SIGNING_PRIVATE_KEY --password $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD

          gh release upload "$env:TAG" $ZIP_PATH "$ZIP_PATH.sig" --clobber

      - name: Upload Signatures Manually (Fallback)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          echo "Uploading signature files..."
          for sig in src-tauri/target/release/bundle/*/*.sig; do
            [ -e "$sig" ] || continue
            gh release upload "$TAG" "$sig" --clobber
          done

      - name: Debug - Check build artifacts
        if: always()
        shell: bash
        run: |
          echo "=== tauri.conf.json pubkey ==="
          grep pubkey src-tauri/tauri.conf.json || echo "No pubkey"
          echo ""
          echo "=== Build artifacts ==="
          ls -la src-tauri/target/release/bundle/nsis/ 2>/dev/null || echo "No nsis dir"
          ls -la src-tauri/target/release/bundle/wix/ 2>/dev/null || echo "No wix dir"

  publish-updater:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          # 提取 commit 日志作为 updater notes
          git fetch --tags --quiet
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 || echo "")

          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges --pretty=format:"- %s")
          else
            NOTES=$(git log -20 --oneline --no-merges --pretty=format:"- %s")
          fi

          INPUT_BODY="${{ github.event.inputs.body }}"
          if [ -n "$INPUT_BODY" ]; then
            NOTES="$INPUT_BODY"
          fi

          # JSON 安全转义（换行转为 \n，双引号转义）
          ESCAPED_NOTES=$(echo "$NOTES" | jq -sR .)

          # 下载所有 build 阶段已上传的 .sig 签名文件
          gh release download "$TAG" -p "*.sig" -R "${{ github.repository }}" || true

          # 初始化 latest.json
          echo "{" > latest.json
          echo "  \"version\": \"$TAG\"," >> latest.json
          echo "  \"notes\": $ESCAPED_NOTES," >> latest.json
          echo "  \"pub_date\": \"$(date -u +'%Y-%m-%dT%H:%M:%SZ')\"," >> latest.json
          echo "  \"platforms\": {" >> latest.json

          first=true
          for sig_file in *.sig; do
            if [ "$sig_file" = "*.sig" ]; then break; fi

            sig_content=$(cat "$sig_file")
            file_name="${sig_file%.sig}"

            platform=""
            if [[ "$file_name" == *"-setup.exe" ]]; then
              platform="windows-x86_64"
            elif [[ "$file_name" == *"portable"*.zip ]]; then
              platform="windows-x86_64-portable"
            elif [[ "$file_name" == *".AppImage" ]]; then
              platform="linux-x86_64"
            else
               continue
            fi

            url="https://github.com/${{ github.repository }}/releases/download/$TAG/$file_name"

            if [ "$first" = true ]; then
              first=false
            else
              echo "    ," >> latest.json
            fi

            echo "    \"$platform\": {" >> latest.json
            echo "      \"signature\": \"$sig_content\"," >> latest.json
            echo "      \"url\": \"$url\"" >> latest.json
            echo "    }" >> latest.json
          done

          echo "  }" >> latest.json
          echo "}" >> latest.json

          echo "Generated latest.json:"
          cat latest.json

          # 统一覆盖上传最终版 latest.json
          gh release upload "$TAG" latest.json --clobber -R "${{ github.repository }}"

          # 确保 Release 页面的说明也更新为完整的日志（防止 tauri-action 重用已有 Release 时不更新正文）
          gh release edit "$TAG" --notes "$NOTES" -R "${{ github.repository }}" || true
